html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover\">
<style>html, body { background: #000; margin: 0; overflow: hidden; }</style>
<script>
// Sound on iPhone. Safari keeps a page's sound off until a real tap, and only some kinds of
// touch count (the end of a touch, not its start). The game's own unlock can miss that, so the
// page also wakes every sound engine the game makes on each tap. And Safari mutes web sound
// while the phone's silent switch is on, unless the page says it plays media, like a video app.
(function () {
  var contexts = [];
  var Original = window.AudioContext || window.webkitAudioContext;
  if (Original) {
    var Wrapped = function (options) {
      var context = options === undefined ? new Original() : new Original(options);
      contexts.push(context);
      return context;
    };
    Wrapped.prototype = Original.prototype;
    window.AudioContext = Wrapped;
    if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
  }
  if (navigator.audioSession) {
    try { navigator.audioSession.type = 'playback'; } catch (e) {}
  }
  function wake() {
    contexts.forEach(function (context) {
      if (context.state !== 'running' && context.state !== 'closed') { context.resume(); }
    });
  }
  ['touchend', 'pointerup', 'mouseup', 'click', 'keydown'].forEach(function (type) {
    window.addEventListener(type, wake, true);
  });
})();
</script>
<script>
// SANGA is played in landscape. A phone or tablet held upright cannot be forced to turn in a
// browser, so the page turns the game itself: it lays the canvas sideways across the screen and
// tells the game the screen is landscape. Taps and drags are turned the same way before the game sees them.
(function () {
  var turned = false;
  function canvas() { return document.getElementById('canvas'); }
  function isHandheld() {
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    return coarse && Math.min(window.innerWidth, window.innerHeight) <= 1100;
  }
  function fit() {
    var c = canvas();
    if (!c) { return; }
    var vw = window.innerWidth, vh = window.innerHeight, ratio = window.devicePixelRatio || 1;
    turned = isHandheld() && vh > vw;
    var w = turned ? vh : vw, h = turned ? vw : vh;
    c.style.position = 'fixed';
    c.style.left = '0px';
    c.style.top = '0px';
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    c.style.transformOrigin = '0 0';
    c.style.transform = turned ? 'translate(' + vw + 'px, 0) rotate(90deg)' : 'none';
    var pw = Math.round(w * ratio), ph = Math.round(h * ratio);
    if (c.width !== pw) { c.width = pw; }
    if (c.height !== ph) { c.height = ph; }
  }
  // Where a point on the turned screen lands in the game, given as the screen position the game
  // expects (it measures taps against the canvas's on-screen box, which is upright).
  function turn(x, y) {
    var vw = window.innerWidth, vh = window.innerHeight;
    return [y * vw / vh, (vw - x) * vh / vw];
  }
  // Rewrites where a touch or a mouse event happened, on the event itself, before the game reads
  // it. Real touches stay touches, so dragging to scroll a list still works. A touch's own
  // position cannot be changed, so each touch list is swapped for a copy with turned positions.
  function setXY(object, x, y) {
    ['clientX', 'pageX', 'screenX'].forEach(function (name) {
      Object.defineProperty(object, name, { value: x, configurable: true, enumerable: true });
    });
    ['clientY', 'pageY', 'screenY'].forEach(function (name) {
      Object.defineProperty(object, name, { value: y, configurable: true, enumerable: true });
    });
  }
  function turnedList(list) {
    var copy = [];
    for (var i = 0; list && i < list.length; i++) {
      var t = list[i], p = turn(t.clientX, t.clientY);
      var touch = { identifier: t.identifier, target: t.target, radiusX: t.radiusX, radiusY: t.radiusY,
        rotationAngle: t.rotationAngle, force: t.force };
      setXY(touch, p[0], p[1]);
      copy.push(touch);
    }
    copy.item = function (i) { return copy[i]; };
    return copy;
  }
  function onMouse(e) {
    if (!turned) { return; }
    var p = turn(e.clientX, e.clientY);
    setXY(e, p[0], p[1]);
  }
  function onTouch(e) {
    if (!turned) { return; }
    ['touches', 'changedTouches', 'targetTouches'].forEach(function (name) {
      Object.defineProperty(e, name, { value: turnedList(e[name]), configurable: true });
    });
  }
  ['mousedown', 'mousemove', 'mouseup'].forEach(function (type) {
    window.addEventListener(type, onMouse, true);
  });
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {
    window.addEventListener(type, onTouch, { capture: true, passive: true });
  });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  document.addEventListener('DOMContentLoaded', function () {
    fit();
    // The engine may set the canvas up while it starts, so fit again for the first few seconds.
    var tries = 0;
    var timer = setInterval(function () { fit(); if (++tries > 20) { clearInterval(timer); } }, 250);
  });
})();
</script>"
