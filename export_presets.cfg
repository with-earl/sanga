html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover\">
<style>html, body { background: #000; margin: 0; overflow: hidden; }</style>
<script>
// SANGA is played in landscape. A phone or tablet held upright cannot be forced to turn in a
// browser, so the page turns the game itself: it lays the canvas sideways across the screen and
// tells the game the screen is landscape. Taps are turned the same way before the game sees them.
(function () {
  var turned = false;
  function canvas() { return document.getElementById('canvas'); }
  function isHandheld() {
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    return coarse && Math.min(window.innerWidth, window.innerHeight) <= 1100;
  }
  function fit() {
    var c = canvas();
    if (!c) { return; }
    var vw = window.innerWidth, vh = window.innerHeight, ratio = window.devicePixelRatio || 1;
    turned = isHandheld() && vh > vw;
    var w = turned ? vh : vw, h = turned ? vw : vh;
    c.style.position = 'fixed';
    c.style.left = '0px';
    c.style.top = '0px';
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    c.style.transformOrigin = '0 0';
    c.style.transform = turned ? 'translate(' + vw + 'px, 0) rotate(90deg)' : 'none';
    var pw = Math.round(w * ratio), ph = Math.round(h * ratio);
    if (c.width !== pw) { c.width = pw; }
    if (c.height !== ph) { c.height = ph; }
  }
  // Where a point on the turned screen lands in the game, given as the screen position the game
  // expects (it measures taps against the canvas's on-screen box, which is upright).
  function turn(x, y) {
    var vw = window.innerWidth, vh = window.innerHeight;
    return [y * vw / vh, (vw - x) * vh / vw];
  }
  function resend(type, source, target, buttons) {
    var p = turn(source.clientX, source.clientY);
    target.dispatchEvent(new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window, clientX: p[0], clientY: p[1],
      screenX: p[0], screenY: p[1], button: 0, buttons: buttons
    }));
  }
  function onMouse(e) {
    if (!turned || !e.isTrusted) { return; }
    e.stopImmediatePropagation();
    e.preventDefault();
    resend(e.type, e, e.target, e.buttons);
  }
  function onTouch(e) {
    if (!turned || e.target !== canvas()) { return; }
    e.stopImmediatePropagation();
    e.preventDefault();
    var t = e.changedTouches[0];
    if (!t) { return; }
    var type = e.type === 'touchstart' ? 'mousedown' : e.type === 'touchmove' ? 'mousemove' : 'mouseup';
    resend(type, t, canvas(), type === 'mouseup' ? 0 : 1);
  }
  ['mousedown', 'mousemove', 'mouseup'].forEach(function (type) {
    window.addEventListener(type, onMouse, true);
  });
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {
    window.addEventListener(type, onTouch, { capture: true, passive: false });
  });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  document.addEventListener('DOMContentLoaded', function () {
    fit();
    // The engine may set the canvas up while it starts, so fit again for the first few seconds.
    var tries = 0;
    var timer = setInterval(function () { fit(); if (++tries > 20) { clearInterval(timer); } }, 250);
  });
})();
</script>"
